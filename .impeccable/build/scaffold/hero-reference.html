<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-1.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tsukimi+Rounded:wght@700&family=Doto:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f2eada}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <figure class="r-hero-desk-photo region plate" data-region="hero-desk-photo"><img src="../../../assets/plates/hero-desk-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- main Arabic display headline --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <div class="r-hero-subhead region text" data-region="hero-subhead"><!-- supporting Arabic subheadline under main title --><p style="font-size:var(--r-hero-subhead-font);font-family:var(--r-hero-subhead-family),sans-serif;font-weight:var(--r-hero-subhead-weight);line-height:1.05;margin:0">hero-subhead</p></div>
  <div class="r-hero-cta-primary region control" data-region="hero-cta-primary"><!-- dark charcoal primary action pill button: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-cta-primary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-cta-secondary region control" data-region="hero-cta-secondary"><!-- outlined secondary action pill button: rebuild the control's chrome from the crop (comp-spec.mjs --crop hero-cta-secondary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-hero-badges region text" data-region="hero-badges"><!-- three horizontal feature badges with captions --><p style="font-size:var(--r-hero-badges-font);line-height:1.05;margin:0">hero-badges</p></div>
  <div class="r-sidebar-brand region text" data-region="sidebar-brand"><!-- ShopBoard brand title and vermilion seal mark --><p style="font-size:var(--r-sidebar-brand-font);line-height:1.05;margin:0">sidebar-brand</p></div>
  <div class="r-sidebar-nav region control" data-region="sidebar-nav"><!-- vertical sidebar navigation links: rebuild the control's chrome from the crop (comp-spec.mjs --crop sidebar-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-enso-mark region plate" data-region="enso-mark"><img src="../../../assets/plates/enso-mark.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-sidebar-featured-photo region plate" data-region="sidebar-featured-photo"><img src="../../../assets/plates/sidebar-featured-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-sidebar-featured-meta region control" data-region="sidebar-featured-meta"><!-- featured item title and action button: rebuild the control's chrome from the crop (comp-spec.mjs --crop sidebar-featured-meta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-card-1-photo region plate" data-region="card-1-photo"><img src="../../../assets/plates/card-1-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-card-1-meta region control" data-region="card-1-meta"><!-- first product title, subtitle, SAR price, and add button: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-1-meta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-card-2-photo region plate" data-region="card-2-photo"><img src="../../../assets/plates/card-2-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-card-2-meta region control" data-region="card-2-meta"><!-- second product title, subtitle, SAR price, and add button: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-2-meta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-card-3-photo region plate" data-region="card-3-photo"><img src="../../../assets/plates/card-3-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-card-3-meta region control" data-region="card-3-meta"><!-- third product title, subtitle, SAR price, and add button: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-3-meta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-card-4-photo region plate" data-region="card-4-photo"><img src="../../../assets/plates/card-4-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-card-4-meta region control" data-region="card-4-meta"><!-- fourth product title, subtitle, SAR price, and add button: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-4-meta); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
